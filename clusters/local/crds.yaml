apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds
  namespace: flux-system
spec:
  interval: 1h
  # Source created by the FluxInstance sync (flux bootstrap convention).
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./crds/overlays/local
  prune: true
  wait: true
  timeout: 5m
