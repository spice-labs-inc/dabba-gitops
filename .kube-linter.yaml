# kube-linter policy for the dabba-authored workloads. Scoped to security
# essentials; HA/replica checks are intentionally omitted (tier-0 is single-node).
# doNotAutoAddDefaults makes this include list authoritative (no default checks).
checks:
  addAllBuiltIn: false
  doNotAutoAddDefaults: true
  include:
    - privileged-container
    - privilege-escalation-container
    - run-as-non-root
    - drop-net-raw-capability
    - unset-cpu-requirements
    - unset-memory-requirements
    - host-network
    - host-ipc
    - host-pid
