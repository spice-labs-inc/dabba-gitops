# EKS Fargate reserves port 10250 for its kubelet; the external-secrets webhook's
# default port collides with it, so admission calls hit the kubelet (wrong cert)
# and every SecretStore/ExternalSecret is rejected. Move it off 10250.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  values:
    webhook:
      port: 9443
