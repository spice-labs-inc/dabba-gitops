name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kustomize:
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: v5.4.3
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize + kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C "$HOME/.local/bin" kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C "$HOME/.local/bin" kubeconform
      - name: Build + validate every standalone kustomization
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r k; do
            dir=$(dirname "$k")
            # kustomize Components aren't standalone-buildable; they're pulled in by overlays.
            if grep -q "kind: Component" "$k"; then
              echo "skip (component): $dir"
              continue
            fi
            echo "== $dir =="
            if ! kustomize build "$dir" | kubeconform -ignore-missing-schemas -strict -summary; then
              fail=1
            fi
          done < <(find . -name 'kustomization.y*ml')
          exit $fail

  # Kubernetes manifest security/best-practice lint (securityContext, limits, probes).
  kube-linter:
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: v5.4.3
    steps:
      - uses: actions/checkout@v4
      - name: Render overlays
        run: |
          mkdir -p "$HOME/.local/bin" rendered
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C "$HOME/.local/bin" kustomize
          while IFS= read -r k; do
            dir=$(dirname "$k")
            grep -q "kind: Component" "$k" && continue
            "$HOME/.local/bin/kustomize" build "$dir" > "rendered/$(echo "$dir" | tr / _).yaml" || true
          done < <(find . -name 'kustomization.y*ml')
      - uses: stackrox/kube-linter-action@v1
        with:
          directory: rendered
          config: .kube-linter.yaml

  # kube-linter (above) is the dedicated Kubernetes manifest security gate. trivy
  # config is not duplicated here — it overlaps kube-linter for k8s and is kept in
  # dabba-modules for IaC scanning, where it covers ground kube-linter doesn't.

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose
