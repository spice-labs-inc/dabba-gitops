---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: observability
---
# Vector agent: collect every pod's logs and ship them to OpenObserve. The sink is
# the pluggability seam — swap it for a SaaS backend or add Slack alerting here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: observability
  annotations:
    # Skip Flux var substitution: ${OPENOBSERVE_PASSWORD} is for Vector's own env
    # interpolation at runtime, not a cluster-var.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  vector.yaml: |
    data_dir: /vector-data-dir
    sources:
      k8s_logs:
        type: kubernetes_logs
    sinks:
      openobserve:
        type: http
        inputs: [k8s_logs]
        uri: "http://openobserve.observability.svc.cluster.local:5080/api/default/k8s/_multi"
        method: post
        auth:
          strategy: basic
          user: "admin@dabba.local"
          password: "${OPENOBSERVE_PASSWORD}"
        encoding:
          codec: json
        framing:
          method: newline_delimited
        batch:
          max_events: 100
          timeout_secs: 5
        request:
          headers:
            Content-Type: application/json
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: observability
  annotations:
    # A node log collector must read root-owned host /var/log; every other
    # privilege is dropped (no caps, no privilege escalation, seccomp default).
    ignore-check.kube-linter.io/run-as-non-root: "log collector needs root to read host /var/log"
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      containers:
        - name: vector
          image: timberio/vector:0.54.0-debian
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OPENOBSERVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openobserve-admin
                  key: password
          # Runs as root: a node log collector needs to read host /var/log, which
          # is typically root-only. Everything else is locked down.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: data
              mountPath: /vector-data-dir
            - name: var-log
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: data
          emptyDir: {}
        - name: var-log
          hostPath:
            path: /var/log
