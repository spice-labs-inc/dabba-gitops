---
# OpenObserve admin password travels OpenBao -> ExternalSecret -> the openobserve-admin
# Secret, which OpenObserve, Vector, and the OTEL collector all read. No shipped default.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-admin
  namespace: observability
spec:
  refreshInterval: 10s
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openobserve-admin
  data:
    - secretKey: password
      remoteRef:
        key: dabba/openobserve
        property: password
