---
# The demo proof: this value travels OpenBao -> ExternalSecret -> HelmRelease
# values -> the podinfo UI banner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: podinfo-message
  namespace: podinfo
spec:
  refreshInterval: 10s
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: podinfo-message
  data:
    - secretKey: message
      remoteRef:
        key: demo/podinfo
        property: message
