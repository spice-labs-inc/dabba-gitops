---
apiVersion: v1
kind: Namespace
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/part-of: dabba
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
  namespace: podinfo
spec:
  type: "oci"
  interval: 1h
  url: oci://ghcr.io/stefanprodan/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: podinfo
spec:
  # Short interval so the app installs promptly once the Vault-backed message
  # secret appears; keep retrying the install until then.
  interval: 1m
  install:
    remediation:
      retries: -1
  chart:
    spec:
      chart: podinfo
      version: "6.14.0"
      sourceRef:
        kind: HelmRepository
        name: podinfo
      interval: 10m
  valuesFrom:
    - kind: Secret
      name: podinfo-message
      valuesKey: message
      targetPath: ui.message
  values:
    replicaCount: 1
