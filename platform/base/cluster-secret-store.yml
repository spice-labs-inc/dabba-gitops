---
apiVersion: v1
kind: Namespace
metadata:
  name: cluster-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cluster-css
spec:
  provider:
    kubernetes:
      remoteNamespace: cluster-secrets
      server:
        caProvider:
          namespace: cluster-secrets
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          namespace: cluster-secrets
          name: "cluster-css"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: cluster-secrets
  name: cluster-css
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-css
  namespace: cluster-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-css
  namespace: cluster-secrets
subjects:
  - kind: ServiceAccount
    name: cluster-css
    apiGroup: ""
roleRef:
  kind: Role
  name: cluster-css
  apiGroup: rbac.authorization.k8s.io
