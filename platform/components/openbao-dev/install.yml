---
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    app.kubernetes.io/part-of: dabba
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 10m
  chart:
    spec:
      chart: openbao
      version: "0.28.4"
      sourceRef:
        kind: HelmRepository
        name: openbao
      interval: 10m
  values:
    global:
      tlsDisable: true
    injector:
      enabled: false
    server:
      dev:
        enabled: true
        devRootToken: "${openbao_root_token}"
      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 256Mi
---
# Token auth against the dev-mode OpenBao. The token is the per-env random root
# token dabba generated (cluster-vars); this component is local-cluster-only.
apiVersion: v1
kind: Secret
metadata:
  name: openbao-dev-token
  namespace: openbao
stringData:
  token: "${openbao_root_token}"
---
# OpenBao is API-compatible with Vault, so External Secrets' vault provider
# talks to it unchanged.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: openbao-dev-token
          namespace: openbao
          key: token
