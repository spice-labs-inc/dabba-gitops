---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: eks-charts
  namespace: kube-system
spec:
  interval: 24h
  url: https://aws.github.io/eks-charts
---
# Fronts the gateway with an AWS NLB (target-type ip, required on Fargate). The
# controller assumes its IRSA role via the annotated service account.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: aws-load-balancer-controller
      version: "1.8.1"
      sourceRef:
        kind: HelmRepository
        name: eks-charts
        namespace: kube-system
      interval: 12h
  values:
    clusterName: "${cluster}"
    region: "${region}"
    vpcId: "${vpc_id}"
    serviceAccount:
      create: true
      name: aws-load-balancer-controller
      annotations:
        eks.amazonaws.com/role-arn: "${lb_controller_role_arn}"
